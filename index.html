<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#fff7f0;--card:#ffffff;--tx:#2b0a0a;--mut:#7d5d57;--ac:#830101;--acx:#ffffff;--soft:#ffe9d2;--bd:#f3d3b8;--ok:#128c4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.demo{background:var(--tx);color:var(--bg);font-size:13px;text-align:center;padding:8px 12px}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:52px;height:52px;border-radius:50%;box-shadow:0 2px 8px rgba(131,1,1,.25)}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#830101,#ff9304,#fcd321);width:0;transition:width .3s}
h1{font-size:30px;line-height:1.08;font-weight:800;margin-bottom:10px}
h2{font-size:25px;line-height:1.15;font-weight:700;margin-bottom:16px}
p.lead{color:var(--mut);font-size:16px;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
@media (hover:hover){.opt:hover{border-color:var(--ac)}}.opt:focus-visible{border-color:var(--ac);outline:none}
.opt:active{background:var(--soft)}
.opt strong{font-size:16px}
.opt span{font-size:13px;color:var(--mut)}
.opt svg{width:56px;height:64px;margin-bottom:4px}
.hint{color:var(--mut);font-size:14px;margin:-6px 0 16px}
.opt .gi.ic svg{width:44px;height:44px}
.opt .gi.sw svg{width:92px;height:32px}
.opt .gi.pr{display:flex;justify-content:center;gap:2px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:24px;color:#830101;line-height:1}
.opt .gi.pr b.off{opacity:.2}
.opts.lst .opt{display:grid;grid-template-columns:104px 1fr;column-gap:14px;row-gap:2px;align-items:center}
.opts.lst .opt .gi{grid-column:1;grid-row:1/3;margin:0}
.opts.lst .opt strong{grid-column:2;grid-row:1;align-self:end}
.opts.lst .opt span:not(.gi){grid-column:2;grid-row:2;align-self:start}
.opt .gi{display:block;background:#fff3e6;border-radius:12px;padding:10px 6px;margin-bottom:8px}.opt .gi svg{display:block;width:92px;height:37px;margin:0 auto}
.cta{background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:16px 18px;font-weight:700;font-size:17px;width:100%;display:block;text-align:center;text-decoration:none}
.cta.wa{background:linear-gradient(180deg,#2fcf6a,#1a9c52);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;font-size:18px;box-shadow:0 0 0 6px rgba(47,207,106,.22)}
.cta.wa svg{width:30px;height:30px;flex:none}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.trow .role,.trow button.prov{margin:0!important;height:30px;box-sizing:border-box;display:inline-flex!important;padding-top:0!important;padding-bottom:0!important;align-items:center;line-height:1}
button.prov{display:inline-flex;align-items:center;gap:6px;background:#830101;color:#fff;border:1.5px solid #830101;border-radius:99px;padding:0 12px;font-size:13px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;cursor:pointer}
@keyframes chama{0%,100%{transform:none}15%{transform:scale(1.08) rotate(-4deg)}30%{transform:scale(1.08) rotate(4deg)}45%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(1.04) rotate(2deg)}75%{transform:none}}
button.prov.mexe{animation:chama .9s ease-in-out}
@media(prefers-reduced-motion: reduce){button.prov.mexe{animation:none}}
button.prov svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand b span{color:var(--mut);font-weight:500}
.steps{display:grid;gap:14px;margin:0 0 22px}
.st{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.st i{width:38px;height:38px;border-radius:50%;background:#830101;color:#fff;font-style:normal;font-weight:800;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif}
.st b{display:block;font-size:16px;line-height:1.2}
.st span{font-size:14px;color:var(--mut)}
.hero{background:linear-gradient(160deg,#830101,#4f0000);color:#fff;border-radius:20px;padding:20px 20px 18px;margin-bottom:26px}
.hero h2{font-size:27px;margin:0 0 8px;color:#fff}
.hero p{margin:0;font-size:15px;line-height:1.5}
.hero p b{color:#fcd321}.hero p.rosto{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);font-size:14.5px}
.res{position:relative}
.res .badge{position:absolute;top:-14px;left:16px;background:#fcd321;color:#830101;font-weight:800;font-size:14px;padding:6px 14px;border-radius:99px;font-family:"Bricolage Grotesque",sans-serif}
.res.top{margin-top:20px}
.ghost{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:14px;font-size:14px}
.back{background:none;border:0;color:var(--mut);font-size:14px;padding:0;margin-bottom:12px}
.res{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px 14px 16px;margin-bottom:14px}
.res.top{border-color:var(--ac)}
.res .role{display:inline-block;margin:12px 0 0;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:800;border:1.5px solid var(--ac);color:var(--ac);font-family:"Bricolage Grotesque",sans-serif}
.lens{background:#fff3e6;border-radius:12px;padding:10px}
.lens svg{width:100%;height:auto;display:block}
.lens .ph{width:100%;height:auto;display:block;border-radius:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:8px}
.row h3{font-size:20px}
.pct{font-weight:800;color:var(--ok);font-size:15px;white-space:nowrap}
.why{color:var(--mut);font-size:14px;margin:4px 0 12px}
.tag{display:inline-block;background:var(--soft);border-radius:99px;padding:3px 10px;font-size:12px;margin-right:6px}
.tip{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:0 0 16px}
.note{font-size:12px;color:var(--mut);margin-top:18px}

/* ====== MINI APP: visual de app ====== */
[hidden]{display:none!important}
.scr{max-width:460px;margin:0 auto;padding:0 0 110px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
#app.wrap{padding-bottom:110px}
.scr a{color:inherit;text-decoration:none}
:where(.scr) button{border:0;background:none;padding:0}
/* cabeçalho */
.hd{background:linear-gradient(150deg,#9a0606 0%,#830101 55%,#5c0000 100%);color:#fff;padding:18px 20px 74px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hd-img{position:absolute;inset:0;background-size:100% auto;background-repeat:no-repeat;background-position:center 46px}
.hd-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,0,0,.78) 0%,rgba(80,0,0,.15) 24%,rgba(120,0,0,.03) 46%,rgba(134,2,2,.7) 64%,#860202 74%,#7a0101 100%),linear-gradient(90deg,rgba(110,0,0,.6) 0%,rgba(110,0,0,0) 20%,rgba(110,0,0,0) 72%,rgba(110,0,0,.88) 100%),radial-gradient(120% 70% at 45% 35%,rgba(0,0,0,0) 50%,rgba(90,0,0,.7) 100%)}
.hd h1{text-shadow:0 2px 12px rgba(60,0,0,.45)}
.hd.foto h1{margin-top:165px!important}
.hd:not(.foto)::after{content:"";position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,147,4,.55),rgba(255,147,4,0) 70%)}
.chegar{display:inline-flex;align-items:center;gap:6px;margin-top:14px;position:relative;z-index:1;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);color:#fff!important;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px}
.chegar svg{width:17px;height:17px;stroke:#fcd321;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hd-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.hd-top img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.hd-top b{display:block;font-size:17px;line-height:1}
.hd-top span{font-size:13px;color:#fcd321;font-weight:700}
.hd h1{color:#fff;font-size:28px;line-height:1.1;margin:26px 0 0;position:relative;z-index:1;font-weight:800}
/* banner do quiz */
.promo{display:flex;align-items:center;gap:8px;margin:-52px 16px 0;position:relative;z-index:2;background:linear-gradient(120deg,#ff9304,#fcd321);border-radius:24px;padding:18px 14px 18px 20px;box-shadow:0 12px 28px rgba(131,1,1,.22);color:#2b0a0a}
.promo small{display:inline-block;background:rgba(131,1,1,.12);color:#830101;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px}
.promo b{display:block;font-size:21px;line-height:1.1;margin:8px 0 12px;font-weight:800}
.promo .pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:#830101;color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px}
.promo .pt{flex:1;min-width:0}
.promo svg{width:112px;flex:none}
.stack{position:relative;width:136px;height:96px;flex:none;margin-right:2px}
.stack .card{position:absolute;inset:0;background:#fff;border-radius:16px;padding:5px;box-shadow:0 8px 18px rgba(92,0,0,.28);transform:rotate(-7deg) scale(.92);opacity:0;transition:opacity .6s,transform .6s}
.stack .card.on{opacity:1;transform:rotate(-5deg) scale(1)}
.stack .card img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.stack .card.cut{background:none;box-shadow:none;padding:0}
.stack .card.cut img{object-fit:contain;border-radius:0;filter:drop-shadow(0 8px 10px rgba(92,0,0,.35))}
.stack .card.cut.on{transform:rotate(-6deg) scale(.98)}
.hd-row{display:flex;align-items:flex-end;gap:10px;position:relative;z-index:1}
.hd-row h1{flex:1}
.pessoa{margin:0 0 -6px;flex:none;width:112px;text-align:center}
.pessoa img,.pessoa .ph{width:104px;height:104px;border-radius:50%;object-fit:cover;display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 4px #fcd321,0 8px 20px rgba(0,0,0,.25)}
.pessoa .ph{background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.55);box-shadow:none;align-content:center;gap:2px}
.pessoa .ph svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2}
.pessoa .ph i{font-style:normal;font-size:11px;line-height:1.1;padding:0 10px}
.pessoa figcaption{margin-top:8px;font-size:12px;line-height:1.15;color:#ffe9d2}
.pessoa figcaption b{display:block;font-size:15px;color:#fff}
/* seções */
.sec{font-size:15px;font-weight:800;color:var(--mut);margin:26px 20px 12px;text-transform:uppercase;letter-spacing:.04em}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.act{position:relative;text-align:center;line-height:1.15}
.soonb{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;background:#fcd321;color:#830101;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.act{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:16px 6px 14px;box-shadow:0 4px 14px rgba(131,1,1,.08);font-weight:700;font-size:15px;color:var(--tx);transition:transform .1s}
.act:active,.qk:active,.big:active,:is(.scr,.sheet) .row:active{transform:scale(.96)}
.ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;flex:none}
.ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c1{background:#ffe3e3;color:#830101}.c2{background:#ffedd6;color:#c25e00}.c3{background:#fff4c4;color:#8a6400}.c4{background:#e0f5e8;color:#137a40}.c5{background:#e8e4ff;color:#4b3aa8}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:2px 16px 6px}
.quick::-webkit-scrollbar{display:none}
.qk{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:13px;font-weight:700;line-height:1.15;color:var(--tx);min-width:0}
.qk .ico{width:60px;height:60px;border-radius:50%;background:var(--card);box-shadow:0 4px 12px rgba(131,1,1,.10);color:#830101}
.qk .ico svg{width:26px;height:26px}
.lock{display:flex;align-items:center;gap:12px;margin:24px 16px 0;padding:14px 16px;border-radius:20px;background:var(--soft);color:var(--mut);font-weight:700}
.lock .ico{width:40px;height:40px;border-radius:14px;background:var(--card)}
.lock .ico svg{width:22px;height:22px;stroke:var(--mut)}
.lock em{margin-left:auto;font-style:normal;font-size:12px;background:var(--card);padding:4px 10px;border-radius:99px}
/* barra de baixo */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.nav > div{pointer-events:auto;width:100%;max-width:460px;background:var(--card);box-shadow:0 -6px 24px rgba(43,10,10,.12);border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));font-family:"Bricolage Grotesque",system-ui,sans-serif}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--mut);text-decoration:none;padding:4px 0}
.nav a svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--ac)}
.nav a.wa{color:#128c4a}
.nav a.wa i{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,211,102,.45),0 0 0 5px var(--card)}
.nav a.wa i svg{width:32px;height:32px;fill:#fff;stroke:none}
/* telas das ferramentas */
:is(.scr,.sheet) .top{position:sticky;top:0;z-index:20;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 8px 8px}
:is(.scr,.sheet) .top b{text-align:center;font-size:18px;font-weight:800}
:is(.scr,.sheet) .top button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tx)}
:is(.scr,.sheet) .top button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.prog{display:flex;gap:6px;padding:0 20px 6px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--soft)}
.prog i.on{background:linear-gradient(90deg,#830101,#ff9304)}
.pad{padding:8px 16px 0}
.q{font-size:26px;line-height:1.12;font-weight:800;margin:14px 4px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--card);border-radius:22px;padding:20px 10px;min-height:150px;box-shadow:0 4px 14px rgba(131,1,1,.08);border:2.5px solid transparent;color:var(--tx);position:relative;transition:transform .1s,border-color .15s}
.big b{font-size:17px;line-height:1.15}
.big small{font-size:13px;color:var(--mut);font-weight:600;line-height:1.2}
.big.on,:is(.scr,.sheet) .row.on{border-color:var(--ac)}
.big .tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;color:transparent;font-weight:800}
.big.on .tick{background:var(--ac);color:#fff}
.list{display:grid;gap:12px}
:is(.scr,.sheet) .row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(131,1,1,.08);border:2.5px solid transparent;text-align:left;width:100%;color:var(--tx);font-family:inherit;transition:transform .1s}
:is(.scr,.sheet) .row b{display:block;font-size:17px;line-height:1.15}
:is(.scr,.sheet) .row small{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
:is(.scr,.sheet) .row .go{margin-left:auto;color:var(--mut);font-size:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:18px;padding:17px;font-family:inherit;font-size:17px;font-weight:800;margin-top:18px;cursor:pointer}
.btn.pri{background:#830101!important;color:#fff!important}
.btn.wa{background:#25d366!important;color:#fff!important;box-shadow:0 8px 20px rgba(37,211,102,.35)}
.btn.wa svg{width:26px;height:26px;fill:#fff}
.btn.alt{background:var(--card)!important;color:var(--ac)!important;box-shadow:0 4px 14px rgba(131,1,1,.08);margin-top:12px}
.btn.txt{color:var(--mut)!important;font-size:15px;font-weight:700;margin-top:8px;padding:12px}
.inp2{width:100%;font-family:inherit;font-size:18px;font-weight:600;color:var(--tx);background:var(--card);border:2.5px solid transparent;border-radius:18px;padding:16px 18px;outline:none;box-shadow:0 4px 14px rgba(131,1,1,.08)}
.inp2:focus{border-color:var(--ac)}
textarea.inp2{min-height:96px;resize:vertical;font-size:16px}
.lb{display:block;font-weight:800;font-size:15px;margin:0 4px 8px}
.fld{margin-bottom:16px}
.err{color:#b3262e;font-size:14px;font-weight:700;margin:8px 4px 0;min-height:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:5px;gap:5px}
.seg button{border-radius:12px;padding:12px 6px;font-family:inherit;font-weight:800;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 8px rgba(131,1,1,.12)}
.cash{text-align:center;background:var(--card);border-radius:26px;padding:22px 16px;box-shadow:0 4px 14px rgba(131,1,1,.08);margin-bottom:14px}
